<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #171717;
    }

    .welcome-page {
      width: 100%;
      min-height: 100vh;
      padding: 28px 18px 35px;
    }

    .welcome-container {
      width: 100%;
      max-width: 475px;
      margin: 0 auto;
    }

    /* WELCOME */
    .welcome-heading {
      text-align: center;
      font-size: 46px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 1px;
      color: #000;
      margin: 3px 0 48px;
    }

    /* PRODUCT CARD */
    .product-card {
      background: #fff;
      border: 1px solid #ededed;
      border-radius: 30px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.07);
    }

    .product-image-box {
      width: 100%;
      background: #fafafa;
      border-radius: 22px;
      min-height: 300px;
      padding: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .product-image {
      display: block;
      width: 100%;
      max-width: 275px;
      height: auto;
      object-fit: contain;
    }

    .product-info {
      padding-top: 21px;
    }

    .product-title {
      font-size: 20px;
      line-height: 1.35;
      font-weight: 700;
      color: #242424;
    }

    /* RATINGS */
    .rating-row {
      margin-top: 11px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .rating-badge {
      background: #3b954e;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      border-radius: 5px;
      padding: 5px 7px;
    }

    .rating-count {
      font-size: 15px;
      color: #8b8b8b;
    }

    /* PRICE */
    .price-row {
      margin-top: 22px;
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 9px;
    }

    .sale-price {
      color: #000;
      font-size: 28px;
      font-weight: 900;
    }

    .compare-price {
      color: #8d8d8d;
      font-size: 16px;
      text-decoration: line-through;
    }

    .discount {
      color: #41964d;
      font-size: 17px;
      font-weight: 800;
    }

    /* BUTTON */
    .continue-btn {
      width: 100%;
      height: 66px;
      margin-top: 31px;
      border: 0;
      border-radius: 5px;
      background: #ff5a18;
      color: #fff;
      font-size: 21px;
      font-weight: 800;
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      text-decoration: none;

      transition:
        transform .2s ease,
        background .2s ease;
    }

    .continue-btn:hover {
      background: #ef4d0d;
      transform: translateY(-1px);
    }

    .cart-icon {
      font-size: 23px;
    }

    /* WELCOME MESSAGE */
    .bottom-message {
      text-align: center;
      color: #666;
      font-size: 19px;
      margin-top: 23px;
      line-height: 1.4;
    }

    /* PAYMENT */
    .payment-row {
      margin-top: 37px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .secure-payment {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #666;
      font-size: 17px;
      white-space: nowrap;
    }

    .lock {
      font-size: 16px;
    }

    .payment-divider {
      width: 1px;
      height: 38px;
      background: #d5d5d5;
    }

    .trusted-payment {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .check-circle {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      border-radius: 50%;
      background: #3478e5;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }

    .trusted-title {
      color: #3155a0;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.2;
    }

    .trusted-subtitle {
      color: #7891ca;
      font-size: 10px;
      margin-top: 2px;
      white-space: nowrap;
    }

    /* MOBILE */
    @media (max-width: 520px) {

      .welcome-page {
        padding: 30px 27px 30px;
      }

      .welcome-heading {
        font-size: 44px;
        margin-bottom: 47px;
      }

      .product-card {
        padding: 20px;
        border-radius: 29px;
      }

      .product-image-box {
        min-height: 300px;
        border-radius: 21px;
      }

      .product-title {
        font-size: 19px;
      }

      .continue-btn {
        height: 66px;
        font-size: 20px;
      }
    }

    @media (max-width: 390px) {

      .welcome-page {
        padding-left: 16px;
        padding-right: 16px;
      }

      .welcome-heading {
        font-size: 38px;
      }

      .product-card {
        padding: 16px;
      }

      .product-image-box {
        min-height: 260px;
      }

      .product-title {
        font-size: 17px;
      }

      .sale-price {
        font-size: 25px;
      }

      .bottom-message {
        font-size: 16px;
      }

      .secure-payment {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <main class="welcome-page">
    <div class="welcome-container">

      <!-- HEADING -->
      <h1 class="welcome-heading">WELCOME</h1>


      <!-- PRODUCT CARD -->
      <div class="product-card">

        <!-- PRODUCT IMAGE -->
        <div class="product-image-box">

          <!--
            YAHAN APNI PRODUCT IMAGE URL DALO
          -->
          <img
            src="https://cdn.shopify.com/s/files/1/0677/5426/2662/files/ChatGPT_Image_Jun_3_2026_02_59_28_PM.png?v=1787339774"
            alt="3 Combo Set Kurta, Pants With Dupatta (DMK-8)"
            class="product-image"
          >

        </div>


        <div class="product-info">

          <!-- PRODUCT TITLE -->
          <div class="product-title">
            3 Combo Set Kurta, Pants With Dupatta (DMK-8)
          </div>


          <!-- RATING -->
          <div class="rating-row">

            <span class="rating-badge">
              4.4 ★
            </span>

            <span class="rating-count">
              (4,320 Ratings)
            </span>

          </div>


          <!-- PRICE -->
          <div class="price-row">

            <span class="sale-price">
              ₹199
            </span>

            <span class="compare-price">
              ₹1,007
            </span>

            <span class="discount">
              80% off
            </span>

          </div>

        </div>
      </div>


      <!-- CONTINUE BUTTON -->

      <!--
        href ME APNI MAIN WEBSITE / PRODUCT LINK DALO
      -->
      <a
        href="https://meesho-dryfuit.vercel.app/category/women-western"
        class="continue-btn"
      >
        <span class="cart-icon">🛒</span>
        <span>Continue to Shopping</span>
      </a>


      <!-- MESSAGE -->
      <div class="bottom-message">
        Welcome to our Women Clothing Store
      </div>


      <!-- PAYMENT TRUST -->
      <div class="payment-row">

        <div class="secure-payment">
          <span class="lock">🔒</span>
          <span>Secure Payment by</span>
        </div>

        <div class="payment-divider"></div>

        <div class="trusted-payment">

          <span class="check-circle">✓</span>

          <div>
            <div class="trusted-title">
              Trusted &amp; Secure
            </div>

            <div class="trusted-subtitle">
              100% Safe Payments
            </div>
          </div>

        </div>

      </div>

    </div>
  </main>

</body>
</html>
